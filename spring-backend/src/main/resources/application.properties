spring.application.name=givehope-backend
server.port=8080

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/givehope}
spring.data.mongodb.auto-index-creation=true

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

app.jwt.secret=${JWT_SECRET:givehope-local-jwt-secret-change-me-please-1234567890}
app.jwt.expiration-ms=2592000000

app.openrouter.api-key=${OPENROUTER_API_KEY:}
app.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1/chat/completions}